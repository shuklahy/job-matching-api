groups:
- name: demo-alerts
  rules:
  - alert: ProfileAPIUnavailable
    expr: up{job="api"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Profile API is unavailable"
  - alert: ProfileWorkerUnavailable
    expr: up{job="worker"} == 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "Profile worker is unavailable"
