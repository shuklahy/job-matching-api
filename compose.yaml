services:
  nginx:
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api]
    restart: unless-stopped
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://demo:${POSTGRES_PASSWORD}@postgres:5432/profiles
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql://demo:${POSTGRES_PASSWORD}@postgres:5432/profiles
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: profiles
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U demo -d profiles']
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ['127.0.0.1:9091:9090']
    volumes:
      - './prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro'
      - 'prometheus_data:/prometheus'
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.5.2
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - 'grafana_data:/var/lib/grafana'
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
    depends_on: [prometheus]
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes: ['elastic_data:/usr/share/elasticsearch/data']
    restart: unless-stopped
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    environment:
      LS_JAVA_OPTS: '-Xms256m -Xmx256m'
    volumes: ['./logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro']
    depends_on: [elasticsearch]
    restart: unless-stopped
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    ports: ['127.0.0.1:5601:5601']
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]
    restart: unless-stopped
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.3
    user: root
    command: ['filebeat','-e','--strict.perms=false']
    volumes:
      - './filebeat.yml:/usr/share/filebeat/filebeat.yml:ro'
      - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
      - 'filebeat_data:/usr/share/filebeat/data'
    depends_on: [logstash]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elastic_data:
  filebeat_data:
